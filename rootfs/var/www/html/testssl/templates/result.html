{% extends "app.html" %}
{% block content %}
<script>
	function getDocHeight() {
		var D = document;
		return Math.max(
			Math.max(D.body.scrollHeight, D.documentElement.scrollHeight),
			Math.max(D.body.offsetHeight, D.documentElement.offsetHeight),
			Math.max(D.body.clientHeight, D.documentElement.clientHeight)
		);
	}
	var scroller = setInterval(function() {	
		document.documentElement.scrollTop = getDocHeight();
	},100 );
</script>
<main class="container-fluid py-4">
<h1 id="topofpage">
    <span id="pagetitle">Test running, please wait ...</span>
    <span id="returnlink" class="d-none">Test done | <a href="{{ url_for('main') }}">Click for new test</a></span>
</h1>
<h2 id="result" class="d-none">Result:</h2>
{% for message in get_flashed_messages() %}
<div class="alert alert-danger" role="alert">{{ message }}</div>
{% endfor %}
<pre>
{{ result | safe }}
</pre>
<hr>
<p><a href="#topofpage">Back to top</a></p>
<hr>
<script>
	document.getElementById("pagetitle").classList.add("d-none");
	document.getElementById("returnlink").classList.remove("d-none");
	document.getElementById("result").classList.remove("d-none");
	document.documentElement.scrollTop = getDocHeight();
	clearInterval(scroller);
</script>
</main>
{% endblock %}
